<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>Daily Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="view"></main>

<nav id="tabbar">
  <button class="tab" data-tab="home" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button class="tab" data-tab="meals" aria-label="Meals">
    <svg viewBox="0 0 24 24"><path d="M7 2v8a2 2 0 0 0 2 2v10h2V2h-1v7H9V2H8v7H7V2zm9 0c-1.7 0-3 2-3 5 0 2.4.8 4.2 2 4.8V22h2V2z"/></svg>
    <span>Meals</span>
  </button>
  <button class="tab" data-tab="train" aria-label="Train">
    <svg viewBox="0 0 24 24"><path d="M20.6 12.9 22 11.5l-1.4-1.4-2.1 2.1-6.7-6.7 2.1-2.1L12.5 2l-1.4 1.4L9.7 2 8.3 3.4 6.9 2 4.8 4.1l1.4 1.4L4.8 6.9l1.4 1.4L4.1 10.4 2 12.5l1.4 1.4 1.4-1.4 6.7 6.7-1.4 1.4 1.4 1.4 2.1-2.1 1.4 1.4 2.1-2.1-1.4-1.4 1.4-1.4z"/></svg>
    <span>Train</span>
  </button>
  <button class="tab" data-tab="progress" aria-label="Progress">
    <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg>
    <span>Progress</span>
  </button>
  <button class="tab" data-tab="news" aria-label="News">
    <svg viewBox="0 0 24 24"><path d="M4 4h13a1 1 0 0 1 1 1v12.5a1.5 1.5 0 0 0 3 0V8h1v9.5A2.5 2.5 0 0 1 19.5 20H6a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1zm2 4h9v3H6zm0 5h9v1.5H6zm0 3h9v1.5H6z"/></svg>
    <span>News</span>
  </button>
</nav>

<div id="modal-root" class="hidden">
  <div id="modal-backdrop"></div>
  <div id="modal-card"></div>
</div>

<div id="toast" class="hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
